name: Publish extension to Open VSX and VS Marketplace

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: openvsx-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node -e "
            const pkg = require('./package.json');
            if ('v' + pkg.version !== process.env.GITHUB_REF_NAME) {
              console.error('tag', process.env.GITHUB_REF_NAME, '!= v' + pkg.version);
              process.exit(1);
            }
          "
      - run: npm ci
      - run: npm test
      - name: Package VSIX
        run: npm run package:vsix
      - name: Publish to Open VSX
        run: |
          version="$(node -p "require('./package.json').version")"
          npx --yes ovsx publish "dist/mediawiki-vscode-editor-${version}.vsix" --trusted-publishing --skip-duplicate
      - name: Publish to VS Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        run: |
          version="$(node -p "require('./package.json').version")"
          npx --yes @vscode/vsce publish --packagePath "dist/mediawiki-vscode-editor-${version}.vsix" -p "$VSCE_PAT" --skip-duplicate
