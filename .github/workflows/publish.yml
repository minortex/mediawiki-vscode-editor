name: Publish extension to Open VSX and VS Marketplace

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: openvsx-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node -e "
            const pkg = require('./package.json');
            if ('v' + pkg.version !== process.env.GITHUB_REF_NAME) {
              console.error('tag', process.env.GITHUB_REF_NAME, '!= v' + pkg.version);
              process.exit(1);
            }
          "
      - run: npm ci
      - run: npm test
      - name: Debug OIDC claims
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fopen-vsx.org" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).value))")
          node -e "const t=process.argv[1]; const p=JSON.parse(Buffer.from(t.split('.')[1],'base64url')); console.log({repository_id:p.repository_id,repository_owner_id:p.repository_owner_id,workflow_ref:p.workflow_ref,environment:p.environment,aud:p.aud,iss:p.iss,repository:p.repository});" "$TOKEN"
      - name: Package VSIX
        run: npm run package:vsix
      - name: Publish to Open VSX
        run: |
          version="$(node -p "require('./package.json').version")"
          npx --yes ovsx publish "dist/mediawiki-vscode-editor-${version}.vsix" --trusted-publishing --skip-duplicate
      - name: Publish to VS Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        run: |
          version="$(node -p "require('./package.json').version")"
          npx --yes @vscode/vsce publish --packagePath "dist/mediawiki-vscode-editor-${version}.vsix" -p "$VSCE_PAT" --skip-duplicate
