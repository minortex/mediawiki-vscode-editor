name: Deploy InPageEdit plugin

on:
  push:
    branches:
      - main
    paths:
      - 'ipe-plugin/**'
      - 'scripts/ipe-version.mjs'
      - 'scripts/update-ipe-registry.mjs'
      - '.github/workflows/pages.yml'
    tags:
      - 'ipe-v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve stable and dev revisions
        id: revisions
        run: |
          git fetch --tags --force
          git fetch origin main
          stable_tag="$(git tag -l 'ipe-v[0-9]*' | grep -E '^ipe-v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)"
          if [ -z "$stable_tag" ]; then
            stable_tag="$(git rev-parse HEAD)"
            echo "No stable ipe-v tag found; using HEAD for the initial stable build." >&2
          fi
          echo "stable_ref=$stable_tag" >> "$GITHUB_OUTPUT"

      - name: Check out stable and dev trees
        run: |
          git worktree add --detach "$RUNNER_TEMP/ipe-stable" "${{ steps.revisions.outputs.stable_ref }}"
          git worktree add --detach "$RUNNER_TEMP/ipe-dev" origin/main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build stable plugin
        run: |
          cd "$RUNNER_TEMP/ipe-stable"
          npm ci
          npm run build:ipe

      - name: Build dev plugin
        env:
          IPE_DEV: '1'
        run: |
          cd "$RUNNER_TEMP/ipe-dev"
          npm ci
          npm run build:ipe

      - name: Assemble Pages artifact
        run: |
          mkdir -p _site/ipe-plugin/dev
          cp "$RUNNER_TEMP/ipe-stable/ipe-plugin/registry.json" _site/ipe-plugin/registry.json
          cp -R "$RUNNER_TEMP/ipe-stable/ipe-plugin/dist" _site/ipe-plugin/dist
          cp "$RUNNER_TEMP/ipe-dev/ipe-plugin/registry.json" _site/ipe-plugin/dev/registry.json
          cp -R "$RUNNER_TEMP/ipe-dev/ipe-plugin/dist" _site/ipe-plugin/dev/dist
          node - <<'NODE'
          const fs = require('node:fs');
          const file = '_site/ipe-plugin/dev/registry.json';
          const registry = JSON.parse(fs.readFileSync(file, 'utf8'));
          registry.base_url = registry.base_url.replace(/\/$/, '') + '/dev/';
          fs.writeFileSync(file, `${JSON.stringify(registry, null, 2)}\n`);
          NODE

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
