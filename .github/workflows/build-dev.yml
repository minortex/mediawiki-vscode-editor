name: Build development VSIX

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-vsix
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Set development version
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const sha = (process.env.GITHUB_SHA || 'local').slice(0, 8);
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const base = pkg.version.split('-')[0];
          pkg.version = `${base}-dev.${sha}`;
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          lock.version = pkg.version;
          if (lock.packages?.['']) lock.packages[''].version = pkg.version;
          fs.writeFileSync('package-lock.json', `${JSON.stringify(lock, null, 2)}\n`);
          NODE
      - name: Package VSIX
        run: npm run package:vsix
      - uses: actions/upload-artifact@v4
        with:
          name: mediawiki-vscode-editor-dev-${{ github.sha }}
          path: dist/*.vsix
          retention-days: 14
          if-no-files-found: error
